<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="preload" href="/src/assets/fonts/inter-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/src/assets/fonts/fraunces-latin-var.woff2" as="font" type="font/woff2" crossorigin />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0e0d0b" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('foodbekary_theme') || 'dark';
          document.documentElement.setAttribute('data-theme', t);
          if (t === 'light') {
            document.documentElement.classList.add('theme-light');
          } else {
            document.documentElement.classList.remove('theme-light');
          }
        } catch(e) {}
      })();
    </script>
    <meta name="description" content="Handcrafted cakes, cookies, macarons and pastries baked fresh every morning." />
    <meta property="og:site_name" content="Foodbekary" />
    <meta property="og:locale" content="en_BD" />
    <title>Foodbekary — Baked Fresh Daily</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
