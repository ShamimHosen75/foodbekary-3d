[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Public pages are prerendered to dist/<path>/index.html and served as-is.
# Everything else (/checkout, /order/*, unknown paths) gets the client-only shell.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# Hashed assets never change — cache for a year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
